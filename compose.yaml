# platen and the platen-chromium container that runs its Chromium engine.
#
#   PLATEN_API_KEYS=change-me docker compose up -d --build
#   curl -u change-me: -H 'Content-Type: application/json' \
#        -d '{"document_type": "pdf", "document_content": "<h1>Hello</h1>"}' \
#        http://localhost:8080/docs > hello.pdf
#
# Every PLATEN_* setting from .env can be added under environment.

services:
  platen:
    build: .
    image: platen:${PLATEN_VERSION:-dev}
    environment:
      PLATEN_API_KEYS: ${PLATEN_API_KEYS:?Set PLATEN_API_KEYS to one or more comma-separated API keys}
      PLATEN_PUBLIC_URL: ${PLATEN_PUBLIC_URL:-}
      PLATEN_CHROMIUM_URL: http://chromium:3000
    ports:
      - "${PLATEN_PORT:-8080}:8080"
    volumes:
      - platen-data:/var/lib/platen
    depends_on:
      - chromium
    # platen gives workers 8 s to finish the document they are rendering, then stops.
    # A document cut off is rendered again once platen is back.
    stop_grace_period: 30s
    restart: unless-stopped

  chromium:
    build: docker/chromium
    image: platen-chromium:${PLATEN_VERSION:-dev}
    environment:
      # Chromium fetches everything through platen's egress proxy, which enforces the
      # network policy; loopback included.
      PLATEN_CHROMIUM_PROXY: http://platen:3128
      # Documents rendered at once; the rest wait their turn.
      PLATEN_CHROMIUM_CONCURRENCY: 6
    restart: unless-stopped

volumes:
  platen-data:
