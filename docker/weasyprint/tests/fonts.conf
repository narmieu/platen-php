<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font configuration of the platen-weasyprint tests: tests/*/conftest.py point
  FONTCONFIG_FILE here. platen's own rules come before the system's, so that the tests
  see the fonts that platen's image sees, in the container and on CI runners.

  fontconfig resolves a relative <include> against FONTCONFIG_PATH, not against the
  directory of this file; the conftests set FONTCONFIG_PATH to this directory.
-->
<fontconfig>
  <!-- platen's default and generic fonts, once docker/fontconfig has them. -->
  <include ignore_missing="yes">../../fontconfig/45-platen.conf</include>

  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>

  <include ignore_missing="yes">/etc/fonts/conf.d</include>

  <cachedir>/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
