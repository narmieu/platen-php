; PHP settings for the platen image. ${...} values come from the environment.

; Real environment variables must reach $_ENV, or the defaults in .env would win.
variables_order = EGPCS
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = UTC
zend.assertions = -1

; Requests carry whole documents; PLATEN_MAX_REQUEST_MB is the limit.
post_max_size = ${PLATEN_MAX_REQUEST_MB}M
upload_max_filesize = ${PLATEN_MAX_REQUEST_MB}M
memory_limit = ${PLATEN_PHP_MEMORY_LIMIT}
; Renders have their own timeouts (PLATEN_SYNC_TIMEOUT and PLATEN_ASYNC_TIMEOUT).
max_execution_time = 0

; https://symfony.com/doc/current/performance.html
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
