name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  PHP_EXTENSIONS: dom, mbstring, pcntl, pdo_sqlite

jobs:
  checks:
    name: Code style, static analysis and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - run: composer validate --strict
      - uses: ramsey/composer-install@v3
      - run: composer cs
      - run: composer phpstan
      - run: composer test

  weasyprint:
    name: WeasyPrint wrapper tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Pango, fonts and the wrapper package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-liberation
          pip install './docker/weasyprint[test]'
      # Each layer patches WeasyPrint for the whole process: one pytest process per layer.
      - name: Quality layer tests
        run: pytest docker/weasyprint/tests/test_cli.py docker/weasyprint/tests/quality
      - name: Prince layer tests
        run: pytest docker/weasyprint/tests/prince

  end-to-end:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
      # --include-deps puts WeasyPrint's own weasyprint command next to weasyprint-platen.
      - name: Install qpdf, fonts, WeasyPrint and platen's wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core fonts-liberation
          sudo cp docker/fontconfig/45-platen.conf /etc/fonts/conf.d/
          pipx install --include-deps ./docker/weasyprint
          weasyprint --version
          weasyprint-platen --version
      - name: Build platen-chromium
        run: docker build -t platen-chromium:dev docker/chromium
      - name: platen-chromium tests
        run: docker run --rm -v "$PWD/docker/chromium/test:/app/test:ro" platen-chromium:dev node --test
      # Host networking, so that Chromium reaches the egress proxy the tests start at
      # 127.0.0.1:3128 and the asset server through the docker0 address.
      - name: Start platen-chromium
        run: |
          docker run -d --name chromium --network host \
            -e PLATEN_CHROMIUM_LISTEN=127.0.0.1:3000 -e PLATEN_CHROMIUM_PROXY=http://127.0.0.1:3128 \
            platen-chromium:dev
          timeout 60 bash -c 'until curl -fs http://127.0.0.1:3000/health > /dev/null; do sleep 1; done'
      # The quality layer against Chromium, in a venv of its own: the layer patches
      # WeasyPrint for the whole process.
      - name: Browser oracle tests
        run: |
          python3 -m venv /tmp/oracle-venv
          /tmp/oracle-venv/bin/pip install './docker/weasyprint[test]'
          PLATEN_CHROMIUM_URL=http://127.0.0.1:3000 /tmp/oracle-venv/bin/pytest docker/weasyprint/tests/oracle
      - run: composer test:e2e
        env:
          PLATEN_WEASYPRINT_BINARY: weasyprint-platen
      - name: platen-chromium log
        if: failure()
        run: docker logs chromium

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    env:
      PLATEN_API_KEYS: smoke-key
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: platen:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build platen-chromium
        uses: docker/build-push-action@v6
        with:
          context: docker/chromium
          load: true
          tags: platen-chromium:dev
          cache-from: type=gha,scope=chromium
          cache-to: type=gha,scope=chromium,mode=max
      - name: Start platen and platen-chromium
        run: docker compose -f compose.yaml -f tests/Docker/compose.smoke.yaml up -d --no-build --wait
      - name: Smoke test
        run: PLATEN_API_KEY=smoke-key tests/Docker/smoke-test.sh
      - name: Container logs
        if: always()
        run: docker compose -f compose.yaml -f tests/Docker/compose.smoke.yaml logs

  publish:
    name: Publish the image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, weasyprint, end-to-end, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches Platen::VERSION
        run: grep -q "VERSION = '${GITHUB_REF_NAME#v}'" src/Platen.php
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
      - id: chromium-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-chromium
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: docker/chromium
          push: true
          tags: ${{ steps.chromium-meta.outputs.tags }}
          labels: ${{ steps.chromium-meta.outputs.labels }}
          cache-from: type=gha,scope=chromium
